services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: fasticket-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fasticket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fasticket-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend Spring Boot
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fasticket-backend
    env_file:
      - .env
    ports:
      - "8081:8080"
    environment:
      # Variables de base de datos
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-fasticket}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

      # Configuración de Spring
      SPRING_PROFILES_ACTIVE: dev
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      
      # Configuración de AWS S3 (valores del .env con fallback local)
      AWS_S3_REGION: ${AWS_S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      
      # JVM Options
      JAVA_OPTS: "-Xmx512m -Xms256m"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fasticket-network
    volumes:
      # Para hot reload en desarrollo (opcional)
      - ./src:/app/src
    restart: unless-stopped

networks:
  fasticket-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local

