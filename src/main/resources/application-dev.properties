spring.application.name=fasticketApp
server.port=8080

spring.config.import=optional:file:.env[.properties]

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fasticket}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Configuración de HikariCP para mejor rendimiento
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

spring.web.cors.allowed-origins=${FRONTEND_URL:http://localhost:4200}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
management.health.redis.enabled=false

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

logging.level.pe.edu.pucp.fasticket=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Configuración del servidor
server.ssl.enabled=false
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# AWS S3 Configuration (usando el mismo bucket de producción)
aws.s3.bucket-name=fasticket-images-g23cs3gj
aws.s3.region=us-east-1
aws.s3.max-file-size=10MB
aws.s3.allowed-file-types=image/jpeg,image/png,image/gif,image/webp

# Variables de entorno de AWS S3
# En desarrollo local, las credenciales se pasan como variables de entorno desde el script docker-compose-dev.ps1
AWS_S3_REGION=${AWS_S3_REGION:us-east-1}
AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:}
AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:}
AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# SpringDoc OpenAPI / Swagger Configuration (DEV)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tryItOutEnabled=true
fasticket.openapi.dev-url=http://localhost:${server.port:8080}

# Brevo Email Service Configuration (DEV)
# ============================================
# CÓMO OBTENER LOS DATOS EN EL PANEL DE BREVO:
# 
# 1. API KEY:
#    - Acceder a: https://app.brevo.com
#    - Ir a: Configuración > SMTP y API > Claves API y MCP
#    - Clic en: "Generar una nueva clave API"
#    - Asignar nombre descriptivo (ej: "Fasticket - Desarrollo")
#    - Copiar la clave generada (solo se muestra una vez)
#    - Configurar como variable de entorno: BREVO_API_KEY
#    - O agregar en archivo .env: BREVO_API_KEY=xkeysib-xxxxx...
#
# 2. SENDER EMAIL (Remitente):
#    - Ir a: Configuración > Remitentes
#    - Agregar o verificar un email remitente
#    - El email debe estar verificado en Brevo (recibirás un email de verificación)
#    - Este será el email que aparecerá como remitente en los correos
#    - Configurar como variable de entorno: BREVO_SENDER_EMAIL
#    - O agregar en archivo .env: BREVO_SENDER_EMAIL=noreply@fasticket.com
#
# 3. SENDER NAME (Nombre del Remitente):
#    - Nombre que aparecerá junto al email del remitente
#    - Ejemplo: "Fasticket", "Equipo Fasticket", etc.
#    - Configurar como variable de entorno: BREVO_SENDER_NAME
#    - O agregar en archivo .env: BREVO_SENDER_NAME=Fasticket
#
# 4. API URL:
#    - Por defecto: https://api.brevo.com/v3/smtp/email
#    - No suele necesitar cambios
#    - Configurar como variable de entorno: BREVO_API_URL (opcional)
#
# IMPORTANTE:
# - Usar claves API diferentes para desarrollo y producción
# - Nunca commitear las claves API en el repositorio
# - El email remitente debe estar verificado en Brevo antes de usarlo
# - Si BREVO_ENABLED=false o BREVO_API_KEY está vacío, los emails se simularán (solo logs)
#
# Ejemplo de archivo .env (crear en la raíz del proyecto):
# BREVO_ENABLED=true
# BREVO_API_KEY=xkeysib-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# BREVO_SENDER_EMAIL=noreply@fasticket.com
# BREVO_SENDER_NAME=Fasticket
# ============================================
brevo.enabled=${BREVO_ENABLED:true}
brevo.api-key=${BREVO_API_KEY:}
brevo.api-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
brevo.sender-email=${BREVO_SENDER_EMAIL:noreply@fasticket.com}
brevo.sender-name=${BREVO_SENDER_NAME:Fasticket}