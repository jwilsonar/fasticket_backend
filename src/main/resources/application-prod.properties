spring.application.name=fasticketApp
server.port=8080

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fasticket}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

spring.web.cors.allowed-origins=${FRONTEND_URL}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.redis.enabled=false
management.health.mail.enabled=false

logging.level.pe.edu.pucp.fasticket=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

server.ssl.enabled=false
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# SpringDoc OpenAPI / Swagger Configuration (PROD)
# En producción, puedes deshabilitar Swagger por seguridad
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
fasticket.openapi.prod-url=${API_BASE_URL:http://fasticket-alb-prod-2050944455.us-east-1.elb.amazonaws.com}

# AWS S3 Configuration
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.max-file-size=10MB
aws.s3.allowed-file-types=image/jpeg,image/png,image/gif,image/webp

# Variables de entorno de AWS S3 para producción
# Las credenciales se obtienen mediante IAM Task Role de ECS (recomendado)
# o se pueden inyectar como variables de entorno: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN
# NO definir estas variables aquí para evitar referencias circulares

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Brevo Email Service Configuration (PROD)
# ============================================
# CÓMO OBTENER LOS DATOS EN EL PANEL DE BREVO:
# 
# 1. API KEY:
#    - Acceder a: https://app.brevo.com
#    - Ir a: Configuración > SMTP y API > Claves API y MCP
#    - Clic en: "Generar una nueva clave API"
#    - Asignar nombre descriptivo (ej: "Fasticket - Producción")
#    - Copiar la clave generada (solo se muestra una vez)
#    - Configurar como variable de entorno: BREVO_API_KEY
#
# 2. SENDER EMAIL (Remitente):
#    - Ir a: Configuración > Remitentes
#    - Agregar o verificar un email remitente
#    - El email debe estar verificado en Brevo
#    - Este será el email que aparecerá como remitente en los correos
#    - Configurar como variable de entorno: BREVO_SENDER_EMAIL
#
# 3. SENDER NAME (Nombre del Remitente):
#    - Nombre que aparecerá junto al email del remitente
#    - Ejemplo: "Fasticket", "Equipo Fasticket", etc.
#    - Configurar como variable de entorno: BREVO_SENDER_NAME
#
# 4. API URL:
#    - Por defecto: https://api.brevo.com/v3/smtp/email
#    - No suele necesitar cambios
#    - Configurar como variable de entorno: BREVO_API_URL (opcional)
#
# IMPORTANTE:
# - Usar claves API diferentes para desarrollo y producción
# - Nunca commitear las claves API en el repositorio
# - Usar variables de entorno en producción (ECS, EC2, etc.)
# - El email remitente debe estar verificado en Brevo antes de usarlo
#
# Variables de entorno recomendadas en producción:
# BREVO_ENABLED=true
# BREVO_API_KEY=xkeysib-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# BREVO_SENDER_EMAIL=noreply@fasticket.com
# BREVO_SENDER_NAME=Fasticket
# BREVO_API_URL=https://api.brevo.com/v3/smtp/email
# ============================================
brevo.enabled=${BREVO_ENABLED:true}
brevo.api-key=${BREVO_API_KEY:}
brevo.api-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
brevo.sender-email=${BREVO_SENDER_EMAIL:noreply@fasticket.com}
brevo.sender-name=${BREVO_SENDER_NAME:Fasticket}