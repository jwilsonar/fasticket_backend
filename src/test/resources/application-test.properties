spring.application.name=fasticketApp-test
server.port=0

# H2 (en memoria) para tests
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:fasticket_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

# Desactivar autoconfiguraciones no necesarias en tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# CORS (no relevante en tests, pero evitar placeholders)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false

# Logging reducido
logging.level.root=WARN
logging.level.pe.edu.pucp.fasticket=INFO

# Desactivar Brevo/email externos en tests
brevo.enabled=false
BREVO_ENABLED=false
BREVO_API_KEY=
BREVO_SENDER_EMAIL=noreply@example.com
BREVO_SENDER_NAME=Fasticket Test
BREVO_API_URL=https://api.brevo.com/v3/smtp/email

spring.application.name=fasticketApp-test
server.port=8080

# Usar H2 en memoria para tests
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Deshabilitar Redis para tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Deshabilitar health check de Redis
management.health.redis.enabled=false

# AWS S3 Configuration para tests (usando valores mock)
aws.s3.bucket-name=test-bucket
aws.s3.region=us-east-1
aws.s3.max-file-size=10MB
aws.s3.allowed-file-types=image/jpeg,image/png,image/gif,image/webp

# File Upload Configuration para tests
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Logging para tests
logging.level.pe.edu.pucp.fasticket=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

