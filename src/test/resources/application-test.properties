# ========================================
# CONFIGURACIÓN DE TESTS - FASTICKET
# ========================================

# Aplicación
spring.application.name=fasticketApp-test
server.port=0

# ========================================
# BASE DE DATOS - H2 en memoria
# ========================================
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:fasticket_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.sql.init.mode=never

# ========================================
# AUTOCONFIGURACIONES DESHABILITADAS
# ========================================
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

management.health.redis.enabled=false

# ========================================
# CONFIGURACIÓN DE EMAIL (MOCK)
# ========================================
# Spring Mail - valores mock para tests
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@fasticket.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Brevo - deshabilitado para tests
brevo.enabled=false
brevo.api-key=test-api-key-dummy
brevo.sender-email=noreply@fasticket-test.com
brevo.sender-name=Fasticket Test
brevo.api-url=https://api.brevo.com/v3/smtp/email

# ========================================
# AWS S3 - MOCK
# ========================================
aws.s3.bucket-name=test-bucket
aws.s3.region=us-east-1
aws.s3.max-file-size=10MB
aws.s3.allowed-file-types=image/jpeg,image/png,image/gif,image/webp

# ========================================
# FILE UPLOAD
# ========================================
# Límite de tamaño para archivos individuales: 10MB
spring.servlet.multipart.max-file-size=10MB
# Límite de tamaño para la petición completa (puede incluir múltiples archivos): 10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Configuración de Tomcat para permitir peticiones HTTP grandes
# Límite del tamaño máximo del POST HTTP: 10MB (10485760 bytes)
server.tomcat.max-http-post-size=10485760

# ========================================
# CORS
# ========================================
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=false

# ========================================
# JWT CONFIGURATION
# ========================================
jwt.secret=test-secret-key-for-testing-purposes-only-minimum-256-bits-required
jwt.expiration=3600000

# ========================================
# LOGGING
# ========================================
logging.level.root=WARN
logging.level.pe.edu.pucp.fasticket=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

